
<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Industrie 4.0 AR – P-101</title>

    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background: #000;
            color: #fff;
        }

        video, canvas {
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain !important;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            width: 90%;
            max-width: 440px;
            padding: 18px;
            border: 1px solid rgba(0,255,150,0.6);
            border-radius: 14px;
            background: rgba(0,0,0,0.88);
            backdrop-filter: blur(8px);
            box-shadow: 0 0 20px rgba(0,255,150,0.2);
        }

        h2 {
            margin: 0 0 16px;
            font-size: 20px;
            color: #00e69a;
        }

        #connection {
            font-size: 13px;
            margin-bottom: 15px;
            color: orange;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 14px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }

        .label {
            font-size: 15px;
            color: #ccc;
        }

        .value {
            font-size: 25px;
            font-weight: bold;
            color: #00e69a;
            text-align: right;
            overflow-wrap: anywhere;
        }

        #last-update {
            margin-top: 14px;
            font-size: 11px;
            color: #aaa;
            text-align: right;
        }

        #marker-status {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(0,0,0,0.75);
            color: #fff;
            font-size: 13px;
            white-space: nowrap;
        }

    </style>

</head>

<body>


    <!-- AR SZENE -->

    <a-scene
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true"
        embedded
        arjs="
            sourceType: webcam;
            facingMode: environment;
            sourceWidth: 1280;
            sourceHeight: 720;
            displayWidth: 1280;
            displayHeight: 720;
            debugUIEnabled: false;
        ">

        <a-marker
            preset="hiro"
            id="hiro-marker">
        </a-marker>

        <a-entity camera></a-entity>

    </a-scene>


    <!-- DATENOVERLAY -->

    <div id="overlay">

        <h2>Industrie 4.0 – Maschine P-101</h2>

        <div id="connection">
            WebSocket: Verbindung wird aufgebaut ...
        </div>

        <div id="data-container">

            <div class="data-row">

                <span class="label">
                    Vibration P-101
                </span>

                <span class="value">
                    Warte auf Daten ...
                </span>

            </div>

        </div>

        <div id="last-update">
            Noch keine Daten empfangen
        </div>

    </div>


    <!-- MARKER STATUS -->

    <div id="marker-status">
        Hiro-Marker noch nicht erkannt
    </div>


    <script>

        // ==========================================
        // WEBSOCKET KONFIGURATION
        // ==========================================

        const TUNNEL_URL =
            "https://7a5a753aca3c52.lhr.life";

        const WS_URL =
            TUNNEL_URL.replace(/^https:/, "wss:") +
            "/vibration";


        // ==========================================
        // HTML ELEMENTE
        // ==========================================

        const overlay =
            document.getElementById("overlay");

        const marker =
            document.getElementById("hiro-marker");

        const connection =
            document.getElementById("connection");

        const dataContainer =
            document.getElementById("data-container");

        const lastUpdate =
            document.getElementById("last-update");

        const markerStatus =
            document.getElementById("marker-status");


        // ==========================================
        // GLOBALE VARIABLEN
        // ==========================================

        window.socket = null;

        let reconnectTimer = null;

        let reconnectDelay = 3000;

        let lastValue = null;

        let hasReceivedData = false;


        // ==========================================
        // DEBUG STATUS
        // ==========================================

        window.getSocketStatus = function() {

            return {

                url: WS_URL,

                state: window.socket
                    ? window.socket.readyState
                    : "kein Socket",

                connected:
                    window.socket?.readyState ===
                    WebSocket.OPEN

            };

        };


        // ==========================================
        // VERBINDUNGSSTATUS
        // ==========================================

        function setConnectionStatus(text, color) {

            connection.textContent = text;

            connection.style.color = color;

        }


        // ==========================================
        // WEBSOCKET VERBINDUNG
        // ==========================================

        function connectWebSocket() {

            if (
                window.socket &&
                (
                    window.socket.readyState === WebSocket.OPEN ||
                    window.socket.readyState === WebSocket.CONNECTING
                )
            ) {
                return;
            }

            console.log(
                "WebSocket-Verbindung:",
                WS_URL
            );

            setConnectionStatus(
                "WebSocket: Verbindung wird aufgebaut ...",
                "orange"
            );

            try {

                window.socket = new WebSocket(WS_URL);

            } catch (error) {

                console.error(
                    "WebSocket konnte nicht gestartet werden:",
                    error
                );

                setConnectionStatus(
                    "WebSocket: Startfehler",
                    "red"
                );

                scheduleReconnect();

                return;
            }


            const currentSocket = window.socket;


            // ======================================
            // VERBUNDEN
            // ======================================

            currentSocket.onopen = function() {

                console.log(
                    "VERBUNDEN MIT NODE-RED"
                );

                setConnectionStatus(
                    "WebSocket: Verbunden mit Node-RED",
                    "#00e69a"
                );

                reconnectDelay = 3000;

            };


            // ======================================
            // DATEN EMPFANGEN
            // ======================================

            currentSocket.onmessage = function(event) {

                console.log(
                    "DATEN VON NODE-RED:",
                    event.data
                );

                let value = event.data;

                try {

                    value = JSON.parse(event.data);

                } catch (error) {

                    console.log(
                        "Einfache Textnachricht empfangen"
                    );

                }

                lastValue = value;

                hasReceivedData = true;

                displayVibration(value);

            };


            // ======================================
            // VERBINDUNG GESCHLOSSEN
            // ======================================

            currentSocket.onclose = function(event) {

                console.warn(
                    "WEBSOCKET GESCHLOSSEN:",
                    event.code,
                    event.reason
                );

                if (window.socket !== currentSocket) {
                    return;
                }

                setConnectionStatus(
                    "WebSocket: Getrennt – Wiederverbindung ...",
                    "orange"
                );

                window.socket = null;

                scheduleReconnect();

            };


            // ======================================
            // FEHLER
            // ======================================

            currentSocket.onerror = function(error) {

                console.error(
                    "WEBSOCKET FEHLER:",
                    error
                );

                if (window.socket === currentSocket) {

                    setConnectionStatus(
                        "WebSocket: Verbindungsfehler",
                        "red"
                    );

                }

            };

        }


        // ==========================================
        // AUTOMATISCHE WIEDERVERBINDUNG
        // ==========================================

        function scheduleReconnect() {

            if (reconnectTimer !== null) {
                return;
            }

            console.log(
                "Neuer Verbindungsversuch in",
                reconnectDelay / 1000,
                "Sekunden"
            );

            reconnectTimer = setTimeout(function() {

                reconnectTimer = null;

                connectWebSocket();

                reconnectDelay = Math.min(
                    reconnectDelay * 2,
                    30000
                );

            }, reconnectDelay);

        }


        // ==========================================
        // VIBRATIONSDATEN ANZEIGEN
        // ==========================================

        function displayVibration(value) {

            const row =
                document.createElement("div");

            row.className = "data-row";


            const label =
                document.createElement("span");

            label.className = "label";

            label.textContent =
                "Vibration P-101";


            const result =
                document.createElement("span");

            result.className = "value";


            let measurement = value;


            // JSON-String verarbeiten

            if (typeof value === "string") {

                try {

                    measurement = JSON.parse(value);

                } catch (error) {

                    measurement = value;

                }

            }


            // JSON-Objekt auswerten

            if (
                typeof measurement === "object" &&
                measurement !== null &&
                Object.prototype.hasOwnProperty.call(
                    measurement,
                    "value"
                )
            ) {

                result.textContent =
                    String(measurement.value);

                if (measurement.unit) {

                    result.textContent +=
                        " " + measurement.unit;

                }

            } else {

                result.textContent =
                    String(measurement);

            }


            row.appendChild(label);

            row.appendChild(result);

            dataContainer.replaceChildren(row);


            lastUpdate.textContent =
                "Letzte Aktualisierung: " +
                new Date().toLocaleTimeString("de-DE");

        }


        // ==========================================
        // MARKER ERKANNT
        // ==========================================

        marker.addEventListener(
            "markerFound",
            function() {

                console.log(
                    "HIRO-MARKER ERKANNT"
                );

                overlay.style.display = "block";

                markerStatus.textContent =
                    "Hiro-Marker erkannt";

                markerStatus.style.color =
                    "#00e69a";


                if (hasReceivedData) {

                    displayVibration(lastValue);

                }

            }
        );


        // ==========================================
        // MARKER VERLOREN
        // ==========================================

        marker.addEventListener(
            "markerLost",
            function() {

                console.log(
                    "HIRO-MARKER VERLOREN"
                );

                overlay.style.display = "none";

                markerStatus.textContent =
                    "Hiro-Marker nicht erkannt";

                markerStatus.style.color =
                    "#fff";

            }
        );


        // ==========================================
        // MANUELLE DEBUG FUNKTIONEN
        // ==========================================

        window.fireEventMarkerFound = function() {

            marker.dispatchEvent(
                new CustomEvent("markerFound")
            );

        };


        window.fireEventMarkerLost = function() {

            marker.dispatchEvent(
                new CustomEvent("markerLost")
            );

        };


        // ==========================================
        // WEBSOCKET STARTEN
        // ==========================================

        connectWebSocket();


    </script>

</body>

</html>
